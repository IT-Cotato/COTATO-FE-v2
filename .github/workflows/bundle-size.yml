name: 📦 번들 사이즈 리포트

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    name: Bundle Size Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env files
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.RECRUIT_API_BASE_URL }}" > apps/recruit/.env
          echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.HOMEPAGE_API_BASE_URL }}" > apps/homepage/.env
          echo "NEXT_PUBLIC_S3_HOSTNAME=${{ secrets.HOMEPAGE_S3_HOSTNAME }}" >> apps/homepage/.env

      - name: Build homepage
        run: pnpm turbo run build --filter=homepage --output-logs=full 2>&1 | tee /tmp/homepage-build.txt
        continue-on-error: true

      - name: Build recruit
        run: pnpm turbo run build --filter=recruit --output-logs=full 2>&1 | tee /tmp/recruit-build.txt
        continue-on-error: true

      - name: 번들 크기 수집
        if: always()
        run: node .github/scripts/collect-bundle-sizes.js

      - name: 번들 사이즈 PR 코멘트 게시
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fn = require('./.github/scripts/bundle-size-report.js')
            await fn({ github, context, core })
