name: Chromatic

on:
  push:
    branches:
      - main
    paths:
      - 'packages/ui/**'
  pull_request:
    paths:
      - 'packages/ui/**'

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          onlyChanged: true

      - name: Set deployment time
        id: time
        if: github.event_name == 'pull_request'
        run: echo "now=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')" >> $GITHUB_OUTPUT

      - name: Comment PR with Chromatic preview
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: chromatic-preview
          message: |
            ## 📚 Storybook 배포 완료

            | 항목 | 내용 |
            |------|------|
            | 🕐 배포 시간 | ${{ steps.time.outputs.now }} |
            | 🔗 스토리북 미리보기 | ${{ steps.chromatic.outputs.storybookUrl }} |
            | 🏗️ 크로마틱 빌드 | ${{ steps.chromatic.outputs.buildUrl }} |
