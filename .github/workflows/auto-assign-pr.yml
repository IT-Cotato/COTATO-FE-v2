name: PR Assignees 지정

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  auto-assign:
    name: PR Assignees 지정
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: hkusu/review-assign-action@v1
        with:
          assignees: ${{ github.actor }}
          reviewers: "kimminna,DandelionQZ,JiiminHa,choyeon2e"